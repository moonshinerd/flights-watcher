[project]
name = "flights-watcher"
version = "0.1.0"
description = "Monitor 24/7 de passagens aéreas e alertas automáticos via Google Flights"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "flights>=0.9.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
flight-monitor = "flight_monitor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
